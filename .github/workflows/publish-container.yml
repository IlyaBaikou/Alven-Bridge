name: publish container

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/ilyabaikou/alven-bridge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/ilyabaikou/alven-bridge
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Package operator files
        run: |
          mkdir -p dist/alven-bridge
          cp compose.yaml .env.example dist/alven-bridge/
          cp scripts/install.sh scripts/install.ps1 scripts/alven-bridge.sh scripts/alven-bridge.ps1 dist/alven-bridge/
          tar -czf "dist/alven-bridge-${GITHUB_REF_NAME}.tar.gz" -C dist alven-bridge
          (cd dist && sha256sum "alven-bridge-${GITHUB_REF_NAME}.tar.gz" > "alven-bridge-${GITHUB_REF_NAME}.sha256")
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/alven-bridge-${GITHUB_REF_NAME}.tar.gz"
          "dist/alven-bridge-${GITHUB_REF_NAME}.sha256"
          --verify-tag --generate-notes
